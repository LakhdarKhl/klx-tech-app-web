  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

2Fp><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:10px;border-top:1px solid rgba(43,31,24,.18);padding-top:24px\"><h2 style=\"margin:0;font-family:'Bricolage Grotesque';font-weight:600;font-size:24px;letter-spacing:-.02em\">Responsabilité<\u002Fh2><p style=\"margin:0;color:#4E4036;font-size:17px;line-height:1.6;text-wrap:pretty\">Les informations présentées sur ce site sont fournies à titre indicatif et ne constituent pas une offre contractuelle. KLx Tech s'efforce d'en assurer l'exactitude mais ne peut garantir qu'elles soient complètes ou à jour. KLx Tech ne saurait être tenue responsable des dommages directs ou indirects résultant de l'accès au site ou de son utilisation.<\u002Fp><p style=\"margin:0;color:#4E4036;font-size:17px;line-height:1.6;text-wrap:pretty\">Les liens vers des sites tiers sont proposés pour information ; KLx Tech n'exerce aucun contrôle sur leur contenu.<\u002Fp><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:10px;border-top:1px solid rgba(43,31,24,.18);padding-top:24px\"><h2 style=\"margin:0;font-family:'Bricolage Grotesque';font-weight:600;font-size:24px;letter-spacing:-.02em\">Prestations<\u002Fh2><p style=\"margin:0;color:#4E4036;font-size:17px;line-height:1.6;text-wrap:pretty\">Les prestations de KLx Tech s'adressent aux professionnels. Elles font l'objet d'un devis et de conditions générales de prestation communiquées avant tout engagement.<\u002Fp><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:10px;border-top:1px solid rgba(43,31,24,.18);padding-top:24px\"><h2 style=\"margin:0;font-family:'Bricolage Grotesque';font-weight:600;font-size:24px;letter-spacing:-.02em\">Données personnelles<\u002Fh2><p style=\"margin:0;color:#4E4036;font-size:17px;line-height:1.6;text-wrap:pretty\">Le traitement de vos données est décrit dans la <a href=\"#confidentialite\">politique de confidentialité<\u002Fa>.<\u002Fp><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:10px;border-top:1px solid rgba(43,31,24,.18);padding-top:24px\"><h2 style=\"margin:0;font-family:'Bricolage Grotesque';font-weight:600;font-size:24px;letter-spacing:-.02em\">Droit applicable<\u002Fh2><p style=\"margin:0;color:#4E4036;font-size:17px;line-height:1.6;text-wrap:pretty\">Les présentes mentions sont régies par le droit français. En cas de litige entre professionnels, et à défaut de résolution amiable, les tribunaux compétents de Toulouse seront seuls compétents.<\u002Fp><\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n<sc-if value=\"{{ isConfid }}\" hint-placeholder-val=\"{{ false }}\">\n<section style=\"max-width:820px;margin:0 auto;padding:clamp(56px,8vw,104px) 24px;display:flex;flex-direction:column;gap:32px\">\n<a href=\"#top\" style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;color:#B0532C;text-decoration:none\" style-hover=\"color:#2B1F18\">← Retour à l'accueil<\u002Fa>\n<div style=\"display:flex;flex-direction:column;gap:12px\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:#6E5D50\">RGPD<\u002Fdiv><h1 style=\"margin:0;font-family:'Bricolage Grotesque';font-weight:600;font-size:clamp(38px,5vw,64px);letter-spacing:-.04em;line-height:1\">Politique de confidentialité<\u002Fh1><p style=\"margin:0;color:#6E5D50;font-size:15px\">Dernière mise à jour : 25 septembre 2026<\u002Fp><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:10px;border-top:1px solid rgba(43,31,24,.18);padding-top:24px\"><h2 style=\"margin:0;font-family:'Bricolage Grotesque';font-weight:600;font-size:24px;letter-spacing:-.02em\">Responsable du traitement<\u002Fh2><p style=\"margin:0;color:#4E4036;font-size:17px;line-height:1.6;text-wrap:pretty\">KLx Tech, représentée par Lakhdar K, domiciliation en cours, Toulouse. Contact : <a href=\"mailto:contact@klxtech.app\">contact@klxtech.app<\u002Fa>.<\u002Fp><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:10px;border-top:1px solid rgba(43,31,24,.18);padding-top:24px\"><h2 style=\"margin:0;font-family:'Bricolage Grotesque';font-weight:600;font-size:24px;letter-spacing:-.02em\">Données collectées<\u002Fh2><p style=\"margin:0;color:#4E4036;font-size:17px;line-height:1.6;text-wrap:pretty\">Nous collectons uniquement les données que vous nous transmettez volontairement via le formulaire de contact ou par email : nom, entreprise, adresse email, téléphone éventuel et contenu de votre message.<\u002Fp><p style=\"margin:0;color:#4E4036;font-size:17px;line-height:1.6;text-wrap:pretty\">Les messages envoyés via le formulaire transitent par le service Web3Forms, qui nous les transmet par email. Aucune donnée n'est stockée sur le site lui-même.<\u002Fp><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:10px;border-top:1px solid rgba(43,31,24,.18);padding-top:24px\"><h2 style=\"margin:0;font-family:'Bricolage Grotesque';font-weight:600;font-size:24px;letter-spacing:-.02em\">Finalités et bases légales<\u002Fh2><p style=\"margin:0;color:#4E4036;font-size:17px;line-height:1.6;text-wrap:pretty\">Vos données servent à répondre à votre demande, à établir un devis et à assurer le suivi de la relation commerciale. Ce traitement repose sur les mesures précontractuelles prises à votre demande et sur notre intérêt légitime à échanger avec nos prospects et clients professionnels (article 6.1 b et f du RGPD).<\u002Fp><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:10px;border-top:1px solid rgba(43,31,24,.18);padding-top:24px\"><h2 style=\"margin:0;font-family:'Bricolage Grotesque';font-weight:600;font-size:24px;letter-spacing:-.02em\">Durée de conservation<\u002Fh2><p style=\"margin:0;color:#4E4036;font-size:17px;line-height:1.6;text-wrap:pretty\">Les données de prospects sont conservées 3 ans à compter du dernier contact. Les données clients sont conservées pendant la durée de la relation contractuelle, puis archivées selon les durées légales (10 ans pour les pièces comptables).<\u002Fp><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:10px;border-top:1px solid rgba(43,31,24,.18);padding-top:24px\"><h2 style=\"margin:0;font-family:'Bricolage Grotesque';font-weight:600;font-size:24px;letter-spacing:-.02em\">Destinataires<\u002Fh2><p style=\"margin:0;color:#4E4036;font-size:17px;line-height:1.6;text-wrap:pretty\">Vos données sont destinées exclusivement à KLx Tech. Elles ne sont ni vendues ni cédées. Nos prestataires techniques (hébergement Vercel, transmission du formulaire Web3Forms, messagerie électronique) peuvent y accéder dans la stricte limite de leur mission.<\u002Fp><p style=\"margin:0;color:#4E4036;font-size:17px;line-height:1.6;text-wrap:pretty\">Certains de ces prestataires sont situés hors de l'Union européenne ; les transferts sont encadrés par le Data Privacy Framework UE–États-Unis ou par des clauses contractuelles types de la Commission européenne.<\u002Fp><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:10px;border-top:1px solid rgba(43,31,24,.18);padding-top:24px\"><h2 style=\"margin:0;font-family:'Bricolage Grotesque';font-weight:600;font-size:24px;letter-spacing:-.02em\">Cookies<\u002Fh2><p style=\"margin:0;color:#4E4036;font-size:17px;line-height:1.6;text-wrap:pretty\">Ce site n'utilise aucun cookie publicitaire ni outil de mesure d'audience. Aucun bandeau de consentement n'est donc nécessaire. Les polices de caractères sont chargées depuis Google Fonts, ce qui transmet votre adresse IP à Google lors de la consultation.<\u002Fp><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:10px;border-top:1px solid rgba(43,31,24,.18);padding-top:24px\"><h2 style=\"margin:0;font-family:'Bricolage Grotesque';font-weight:600;font-size:24px;letter-spacing:-.02em\">Vos droits<\u002Fh2><p style=\"margin:0;color:#4E4036;font-size:17px;line-height:1.6;text-wrap:pretty\">Conformément au RGPD et à la loi Informatique et Libertés, vous disposez d'un droit d'accès, de rectification, d'effacement, de limitation, d'opposition et de portabilité de vos données. Pour les exercer, écrivez à <a href=\"mailto:contact@klxtech.app\">contact@klxtech.app<\u002Fa>. Une réponse vous sera apportée sous un mois.<\u002Fp><p style=\"margin:0;color:#4E4036;font-size:17px;line-height:1.6;text-wrap:pretty\">Si vous estimez que vos droits ne sont pas respectés, vous pouvez adresser une réclamation à la CNIL (cnil.fr).<\u002Fp><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:10px;border-top:1px solid rgba(43,31,24,.18);padding-top:24px\"><h2 style=\"margin:0;font-family:'Bricolage Grotesque';font-weight:600;font-size:24px;letter-spacing:-.02em\">Sécurité<\u002Fh2><p style=\"margin:0;color:#4E4036;font-size:17px;line-height:1.6;text-wrap:pretty\">KLx Tech met en œuvre des mesures techniques et organisationnelles adaptées pour protéger vos données contre la perte, l'accès non autorisé ou la divulgation.<\u002Fp><\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n<sc-if value=\"{{ isLegal }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"border-top:1px solid rgba(43,31,24,.14)\"><div style=\"max-width:1200px;margin:0 auto;padding:28px 24px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:14px;color:#6E5D50\"><span>© 2026 KLx Tech — Toulouse · <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px\">v1.04.00<\u002Fspan><\u002Fspan><div style=\"display:flex;gap:20px\"><a href=\"#mentions-legales\" style=\"color:#6E5D50\" style-hover=\"color:#2B1F18\">Mentions légales<\u002Fa><a href=\"#confidentialite\" style=\"color:#6E5D50\" style-hover=\"color:#2B1F18\">Confidentialité<\u002Fa><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsc-if>\n<\u002Fmain><\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;faqOpenFirst&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}\">\nclass Component extends DCLogic {\n  state = { open: this.props.faqOpenFirst === false ? -1 : 0, sent: false, sending: false, error: false, page: 'home' };\n  componentDidMount() { this.onHash = () => this.route(); window.addEventListener('hashchange', this.onHash); this.route(); }\n  componentWillUnmount() { window.removeEventListener('hashchange', this.onHash); }\n  route() {\n    const h = location.hash.slice(1);\n    const page = h === 'mentions-legales' ? 'mentions' : h === 'confidentialite' ? 'confid' : 'home';\n    this.setState({ page }, () => {\n      if (page !== 'home' || !h || h === 'top') { window.scrollTo(0, 0); return; }\n      const el = document.getElementById(h);\n      if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 72 });\n    });\n  }\n  renderVals() {\n    const faq = [\n      { q: \"Faut-il déjà avoir des outils numériques ?\", a: \"Non. On part de votre situation actuelle, même si tout se fait encore sur papier ou dans des tableurs.\" },\n      { q: \"L'IA est-elle adaptée à une petite structure ?\", a: \"Souvent, oui. On commence par des usages simples et mesurables : rédaction, tri de documents, réponses aux demandes récurrentes.\" },\n      { q: \"Que deviennent nos données ?\", a: \"Elles restent les vôtres. Chaque outil est choisi en tenant compte de la confidentialité et du RGPD, avec des solutions hébergées en local quand c'est pertinent.\" },\n      { q: \"Combien coûte un accompagnement ?\", a: \"Chaque projet fait l'objet d'un devis après un premier échange, en fonction du périmètre.\" },\n      { q: \"Intervenez-vous hors de Toulouse ?\", a: \"Oui, à distance. Les rendez-vous en présentiel se font sur Toulouse et ses environs.\" }\n    ].map((f, i) => ({ ...f, open: this.state.open === i, sign: this.state.open === i ? \"−\" : \"+\", toggle: () => this.setState(s => ({ open: s.open === i ? -1 : i })) }));\n    return {\n      isHome: this.state.page === 'home', isMentions: this.state.page === 'mentions', isConfid: this.state.page === 'confid', isLegal: this.state.page !== 'home',\n      faq,\n      sent: this.state.sent,\n      notSent: !this.state.sent,\n      submit: async (e) => {\n        e.preventDefault();\n        if (this.state.sending) return;\n        const f = new FormData(e.target);\n        if (f.get('botcheck')) return;\n        this.setState({ sending: true, error: false });\n        try {\n          const r = await fetch('https://api.web3forms.com/submit', { method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json' }, body: JSON.stringify({\n            access_key: '98d28476-b1bd-4706-b241-212cea7a58ee',\n            subject: 'Demande de rendez-vous — ' + (f.get('entreprise') || f.get('nom')),\n            from_name: 'Site KLx Tech',\n            name: f.get('nom'), email: f.get('email'), entreprise: f.get('entreprise'), message: f.get('besoin')\n          }) });\n          const j = await r.json();\n          if (!j.success) throw new Error(j.message);\n          this.setState({ sent: true, sending: false });\n        } catch (err) { this.setState({ sending: false, error: true }); }\n      },\n      btnLabel: this.state.sending ? 'Envoi en cours…' : 'Demander un rendez-vous',\n      error: !!this.state.error,\n      reset: () => this.setState({ sent: false }),\n      offres: [\n        { n: \"01\", title: \"Audit & diagnostic numérique\", desc: \"Nous faisons le point sur vos outils, vos process et vos données pour repérer ce qui mérite d'être amélioré en priorité.\" },\n        { n: \"02\", title: \"Intégration de l'IA\", desc: \"Assistants et agents IA branchés sur vos usages réels, avec des règles claires sur l'utilisation de vos données.\" },\n        { n: \"03\", title: \"Automatisation de process\", desc: \"Relances, saisies, exports, reporting : nous supprimons les tâches répétitives entre vos logiciels.\" },\n        { n: \"04\", title: \"Applications sur mesure\", desc: \"Outils web, tableaux de bord, APIs : développés proprement et faciles à faire évoluer.\" },\n        { n: \"05\", title: \"Formation des équipes\", desc: \"Des sessions concrètes pour que vos équipes utilisent l'IA et leurs nouveaux outils avec confiance.\" },\n        { n: \"06\", title: \"Accompagnement continu\", desc: \"Suivi, maintenance et évolutions, avec un interlocuteur technique qui connaît votre entreprise.\" }\n      ],\n      etapes: [\n        { n: \"01\", title: \"Échanger\", desc: \"Un premier rendez-vous pour comprendre votre activité, vos contraintes et ce qui vous fait perdre du temps.\" },\n        { n: \"02\", title: \"Diagnostiquer\", desc: \"Un état des lieux clair et une feuille de route priorisée, avec ce qui est utile tout de suite.\" },\n        { n: \"03\", title: \"Construire\", desc: \"Mise en place par étapes courtes, testée avec vos équipes avant d'aller plus loin.\" },\n        { n: \"04\", title: \"Accompagner\", desc: \"Formation, suivi et ajustements pour que les nouveaux outils soient vraiment utilisés.\" }\n      ],\n      stack: [\"Angular\", \"C#/.NET\", \"SQL Server\", \"ETL · KPI\", \"Node.js\", \"MongoDB\", \"LLM local\", \"DevOps léger\"]\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
